# Kubernetes objects for demo.tape. All values are fake. The API key is built
# from two parts so that secret scanners do not flag this file.
#
#   kubectl apply --server-side -f assets/demo.yaml
#   kubectl -n demo rollout status deploy/checkout
#   vhs assets/demo.tape
#   kubectl delete -f assets/demo.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: checkout-db
  namespace: demo
stringData:
  DATABASE_URL: postgres://checkout:Xk9vQ2mLp7Rt@db.shop.svc:5432/orders
  SESSION_SECRET: 4c9e1f7a2b8d5e3f0a6c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: checkout
          image: busybox:1.36.1
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - sh
            - -c
            - |
              key="Qm2LvX7pT4wR""n8dJ3bY5cH6f"
              echo "level=info msg=\"checkout v3.2.0 starting\" port=8080"
              echo "level=info msg=\"loaded config\" api_key=$key"
              echo "level=info msg=\"order placed\" order=8812 user=jordan.lee@shopco.io ip=203.0.113.42"
              echo "level=error msg=\"db dial failed\" url=postgres://checkout:Xk9vQ2mLp7Rt@db.shop.svc:5432/orders"
              sleep infinity
